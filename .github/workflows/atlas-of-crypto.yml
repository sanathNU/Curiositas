name: deploy atlas-of-crypto
on:
  push:
    branches: [main]
    paths: ["projects/atlas-of-crypto/**", "lib/atlas/**", ".github/workflows/atlas-of-crypto.yml"]
  workflow_dispatch:

concurrency: gh-pages-deploy   # shared group: serialize all pushes to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # data plus the shared atlas engine (lib/atlas); build checks the data, then writes dist/
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node lib/atlas/tools/atlas.mjs build projects/atlas-of-crypto

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: projects/atlas-of-crypto/dist
          destination_dir: atlas-of-crypto
          keep_files: true
