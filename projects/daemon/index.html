<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daemon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
</head>
<body>
<style>
:root {
  --bg: #ffffff; --fg: #111111; --mid: #555555; --faint: #9a9a9a;
  --rule: #d4d4d4; --hl: #f1f1f1; --mark: #fff1a8;
  --user-bg: #f5f5f2; --code-bg: #f5f5f2;
  /* province fills — source accent colors */
  --src-claude: #D3C6E2; --src-lm: #CDE7C8; --src-chatgpt: #F2BCB8;
  --src-webui: #BBD0EA; --src-import: #F8D7A8; --src-ollama: #D9DECF;
  /* typography */
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --serif: 'Literata', Georgia, serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
  --sidebar-w: 320px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --fg: #e4e4e4; --mid: #a8a8a8; --faint: #6e6e6e;
    --rule: #353535; --hl: #232323; --mark: #5a4d14;
    --user-bg: #1e1e1e; --code-bg: #1e1e1e;
    --src-claude: #463c5a; --src-lm: #344b37; --src-chatgpt: #5a3636;
    --src-webui: #33445b; --src-import: #5a472b; --src-ollama: #43473e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --fg: #e4e4e4; --mid: #a8a8a8; --faint: #6e6e6e;
  --rule: #353535; --hl: #232323; --mark: #5a4d14;
  --user-bg: #1e1e1e; --code-bg: #1e1e1e;
  --src-claude: #463c5a; --src-lm: #344b37; --src-chatgpt: #5a3636;
  --src-webui: #33445b; --src-import: #5a472b; --src-ollama: #43473e;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  height: 100vh;
  overflow: hidden;
}

a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint);
    text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--fg); }

.app { display: flex; height: 100%; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; height: 100%;
}

.sidebar-header {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--rule);
}

.logo {
  font-family: var(--serif);
  font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}

.logo-mark {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--mid); flex-shrink: 0;
}

.search-box { position: relative; }

.search-box input {
  width: 100%; padding: 7px 12px 7px 30px;
  border: 1px solid var(--rule); border-radius: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--mono); font-size: 12px;
  outline: none;
}
.search-box input:focus { border-color: var(--fg); }
.search-box input::placeholder { color: var(--faint); }

.search-icon {
  position: absolute; left: 9px; top: 50%;
  transform: translateY(-50%); color: var(--faint); pointer-events: none;
}

.filter-bar {
  display: flex; gap: 0; border-bottom: 1px solid var(--rule);
  overflow-x: auto;
}

.filter-chip {
  font-family: var(--mono); font-size: 10.5px;
  padding: 6px 12px; border: none; border-bottom: 2px solid transparent;
  background: transparent; color: var(--faint);
  cursor: pointer; white-space: nowrap; letter-spacing: 0.02em;
}
.filter-chip:hover { color: var(--mid); }
.filter-chip.active { color: var(--fg); border-bottom-color: var(--fg); }

.session-list { flex: 1; overflow-y: auto; }

.session-item {
  padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid var(--rule);
}
.session-item:hover { background: var(--hl); }
.session-item.active { background: var(--hl); }

.session-title {
  font-family: var(--serif); font-size: 14px; font-weight: 400;
  line-height: 1.35; color: var(--fg); margin-bottom: 3px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}

.session-meta {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px;
  color: var(--faint); letter-spacing: 0.02em;
}

.source-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}

.meta-sep { color: var(--rule); }

.sidebar-footer {
  padding: 10px 16px; border-top: 1px solid var(--rule);
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  display: flex; justify-content: space-between;
}

/* ── Main ── */
.main {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0; height: 100%;
}

.main-empty {
  flex: 1; display: flex; align-items: center;
  justify-content: center; padding: 40px;
}

.empty-state { max-width: 380px; text-align: center; }

.empty-state h2 {
  font-family: var(--serif); font-size: 22px; font-weight: 600;
  margin: 0 0 6px; letter-spacing: -0.01em;
}
.empty-state p {
  font-size: 14px; color: var(--mid); margin: 0 0 20px; line-height: 1.6;
}
.empty-state .hint {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  background: var(--hl); padding: 12px 14px; text-align: left; line-height: 1.7;
}

.conv-header {
  padding: 18px 28px; border-bottom: 1px solid var(--rule);
}

.conv-title {
  font-family: var(--serif); font-size: 1.4rem; font-weight: 600;
  line-height: 1.2; margin: 0 0 6px; text-wrap: balance;
}

.conv-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 10.5px; color: var(--mid);
}

.conv-tag {
  padding: 2px 8px; border: 1px solid var(--rule); font-size: 10px;
}

.conv-body {
  flex: 1; overflow-y: auto;
  padding: 20px 28px 60px;
  display: flex; flex-direction: column; gap: 16px;
}

.message {
  max-width: 75%; padding: 12px 16px; border-radius: 12px;
}
.message.human {
  align-self: flex-end;
  background: var(--user-bg); border: 1px solid var(--rule);
  border-bottom-right-radius: 2px;
}
.message.bot {
  align-self: flex-start;
  border-bottom-left-radius: 2px;
}
.message.system-msg {
  align-self: center; max-width: 60%;
  padding: 6px 14px; border: 1px solid var(--rule);
  border-radius: 8px; text-align: center;
}
.message.system-msg .message-content {
  font-family: var(--mono); font-size: 11px; color: var(--faint);
  line-height: 1.5;
}

.message-content {
  font-family: var(--serif); font-size: 15px;
  line-height: 1.7; color: var(--fg); hyphens: auto;
}
.message-content p { margin: 0 0 10px; }
.message-content p:last-child { margin-bottom: 0; }

.message-content pre {
  background: var(--code-bg); border: 1px solid var(--rule);
  padding: 12px 14px; overflow-x: auto;
  font-family: var(--mono); font-size: 12px; line-height: 1.55;
  margin: 10px 0;
}

.message-content code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--code-bg); padding: 1px 4px;
}
.message-content pre code { background: none; padding: 0; }
.message.human .message-content pre { background: var(--bg); }

.message-content h1, .message-content h2, .message-content h3 {
  font-family: var(--serif); font-weight: 600;
  margin: 18px 0 6px;
}
.message-content h1 { font-size: 1.3rem; }
.message-content h2 { font-size: 1.1rem; }
.message-content h3 { font-size: 1rem; }

.message-content ul, .message-content ol { padding-left: 22px; margin: 6px 0; }
.message-content li { margin-bottom: 3px; }

.message-content blockquote {
  border-left: 2px solid var(--rule); margin: 10px 0;
  padding: 2px 14px; color: var(--mid); font-style: italic;
}

.message-content a {
  color: var(--fg); text-decoration: underline;
  text-decoration-color: var(--faint); text-underline-offset: 2px;
}

.message-content hr { border: none; border-top: 1px solid var(--rule); margin: 18px 0; }
.message-content img { max-width: 100%; }

.message-divider {
  display: flex; align-items: center; gap: 14px;
  margin: 28px 0; max-width: 64ch;
}
.message-divider::before, .message-divider::after {
  content: ''; flex: 1; border-top: 1px solid var(--rule);
}
.message-divider span {
  font-family: var(--mono); font-size: 10px; color: var(--faint);
  text-transform: uppercase; letter-spacing: 0.08em;
}

.no-transcript { padding: 40px 28px; text-align: center; }
.no-transcript h3 {
  font-family: var(--serif); font-size: 17px; font-weight: 600;
  margin: 0 0 6px;
}
.no-transcript p {
  font-size: 14px; color: var(--mid); margin: 0 0 16px;
  max-width: 50ch; margin-left: auto; margin-right: auto;
}

.prompt-list { text-align: left; max-width: 50ch; margin: 0 auto; }
.prompt-item { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.prompt-item:last-child { border-bottom: none; }
.prompt-time { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-bottom: 2px; }

.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 60px; color: var(--faint); font-family: var(--mono); font-size: 12px;
}
.loading-dot {
  width: 5px; height: 5px; background: var(--mid); border-radius: 50%;
  margin-right: 8px; animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}

.session-list::-webkit-scrollbar, .conv-body::-webkit-scrollbar { width: 5px; }
.session-list::-webkit-scrollbar-track, .conv-body::-webkit-scrollbar-track { background: transparent; }
.session-list::-webkit-scrollbar-thumb, .conv-body::-webkit-scrollbar-thumb { background: var(--rule); }

@media (max-width: 700px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; height: auto; max-height: 45vh;
             border-right: none; border-bottom: 1px solid var(--rule); }
  .sidebar.hidden { display: none; }
  .main.hidden { display: none; }
  .conv-header { padding: 14px 18px; }
  .conv-body { padding: 14px 18px 40px; }
  .mobile-back { display: flex !important; }
}
.mobile-back {
  display: none; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 11px; color: var(--mid);
  cursor: pointer; margin-bottom: 8px; border: none; background: none; padding: 0;
}
.mobile-back:hover { color: var(--fg); }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .loading-dot { animation: none; opacity: 0.6; }
}
</style>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark"></div>
        Daemon
      </div>
      <div class="search-box">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search conversations…">
      </div>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="session-list" id="sessionList">
      <div class="loading"><div class="loading-dot"></div>Loading…</div>
    </div>
    <div class="sidebar-footer" id="sidebarFooter"><span>—</span></div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty" id="emptyState">
      <div class="empty-state">
        <h2>Daemon</h2>
        <p>A reading room for your conversations. Select one from the sidebar.</p>
        <div class="hint">
          Sources: Claude Code, LM Studio, ChatGPT exports, OpenAI-compatible JSON<br><br>
          Drop files into <code style="font-family:var(--mono);font-size:11px">data/imports/</code> to add conversations
        </div>
      </div>
    </div>
    <div id="convView" hidden>
      <div class="conv-header" id="convHeader"></div>
      <div class="conv-body" id="convBody"></div>
    </div>
  </main>
</div>

<script>
const API = '';
let allSessions = [];
let activeId = null;
let activeFilter = 'all';

const SOURCE_COLORS = {
  'claude-code': 'var(--src-claude)',
  'lm-studio': 'var(--src-lm)',
  'chatgpt': 'var(--src-chatgpt)',
  'open-webui': 'var(--src-webui)',
  'import': 'var(--src-import)',
  'claude': 'var(--src-claude)',
  'ollama': 'var(--src-ollama)',
};

const SOURCE_LABELS = {
  'claude-code': 'Claude Code',
  'lm-studio': 'LM Studio',
  'chatgpt': 'ChatGPT',
  'open-webui': 'Open WebUI',
  'import': 'Import',
  'claude': 'Claude',
  'ollama': 'Ollama',
};

async function fetchJSON(url) {
  const res = await fetch(API + url);
  return res.json();
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(typeof ts === 'number' ? ts : ts);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (diff < 604800000) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatFullDate(ts) {
  if (!ts) return '';
  const d = new Date(typeof ts === 'number' ? ts : ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
    ' – ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getSources(sessions) {
  const s = new Set();
  for (const c of sessions) if (c.source) s.add(c.source);
  return [...s].sort();
}

function getProjects(sessions) {
  const s = new Set();
  for (const c of sessions) {
    const p = c.project_short;
    if (p) s.add(p);
  }
  return [...s].sort();
}

function renderFilters(sessions) {
  const sources = getSources(sessions);
  const bar = document.getElementById('filterBar');
  let html = '<button class="filter-chip active" data-filter="all">All</button>';
  for (const src of sources) {
    const label = SOURCE_LABELS[src] || src;
    html += `<button class="filter-chip" data-filter="src:${src}">${label}</button>`;
  }
  bar.innerHTML = html;
  bar.addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    activeFilter = chip.dataset.filter;
    bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderSessionList(allSessions);
  });
}

function renderSessionList(sessions) {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('sessionList');
  let filtered = sessions;

  if (activeFilter.startsWith('src:')) {
    const src = activeFilter.slice(4);
    filtered = filtered.filter(s => s.source === src);
  } else if (activeFilter.startsWith('proj:')) {
    const proj = activeFilter.slice(5);
    filtered = filtered.filter(s => s.project_short === proj);
  }

  if (search) {
    filtered = filtered.filter(s =>
      (s.title || '').toLowerCase().includes(search) ||
      (s.model || '').toLowerCase().includes(search) ||
      (s.project_short || '').toLowerCase().includes(search) ||
      (s.source || '').toLowerCase().includes(search)
    );
  }

  if (!filtered.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:11px">No conversations found</div>';
    return;
  }

  list.innerHTML = filtered.map(s => {
    const title = s.title || s.id.slice(0, 14) + '…';
    const src = s.source || 'import';
    const srcColor = SOURCE_COLORS[src] || 'var(--faint)';
    const date = formatDate(s.updated || s.created);
    const msgs = s.message_count || 0;
    let model = s.model ? s.model.split('/').pop() : '';
    if (model.length > 20) model = model.slice(0, 18) + '…';
    return `
      <div class="session-item ${s.id === activeId ? 'active' : ''}" data-id="${s.id}">
        <div class="session-title">${escapeHtml(title)}</div>
        <div class="session-meta">
          <span class="source-dot" style="background:${srcColor}"></span>
          <span>${SOURCE_LABELS[src] || src}</span>
          ${model ? `<span class="meta-sep">/</span><span>${escapeHtml(model)}</span>` : ''}
          ${msgs ? `<span class="meta-sep">·</span><span>${msgs} msgs</span>` : ''}
          ${date ? `<span class="meta-sep">·</span><span>${date}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('.session-item').forEach(el => {
    el.addEventListener('click', () => openSession(el.dataset.id));
  });
}

async function openSession(id) {
  activeId = id;
  renderSessionList(allSessions);

  document.getElementById('emptyState').hidden = true;
  document.getElementById('convView').hidden = false;

  const header = document.getElementById('convHeader');
  const body = document.getElementById('convBody');
  body.innerHTML = '<div class="loading"><div class="loading-dot"></div>Loading…</div>';

  if (window.innerWidth <= 700) {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
  }

  const session = await fetchJSON(`/api/session?id=${id}`);
  if (!session) {
    body.innerHTML = '<div class="no-transcript"><p>Conversation not found.</p></div>';
    return;
  }

  const title = session.title || session.id.slice(0, 14);
  const src = session.source || 'import';
  const srcColor = SOURCE_COLORS[src] || 'var(--faint)';
  const srcLabel = SOURCE_LABELS[src] || src;
  const dateStr = formatFullDate(session.created || session.updated);

  header.innerHTML = `
    <button class="mobile-back" onclick="goBack()">← Back</button>
    <h1 class="conv-title">${escapeHtml(title)}</h1>
    <div class="conv-meta">
      <span class="source-dot" style="background:${srcColor}"></span>
      <span>${srcLabel}</span>
      ${session.model ? `<span class="conv-tag">${escapeHtml(session.model)}</span>` : ''}
      <span>${session.message_count || 0} messages</span>
      ${dateStr ? `<span>${dateStr}</span>` : ''}
    </div>`;

  if (session.messages && session.messages.length > 0) {
    body.innerHTML = renderMessages(session.messages);
  } else {
    let html = `<div class="no-transcript">
      <h3>Content not available</h3>
      <p>This conversation's content is encrypted at rest or hasn't been imported yet.</p>
    </div>`;
    if (session.prompts && session.prompts.length > 0) {
      html += `<div style="max-width:56ch;margin:0 auto">
        <div class="message-divider"><span>prompts from this project</span></div>
        <div class="prompt-list">`;
      for (const p of session.prompts) {
        html += `<div class="prompt-item">
          <div class="prompt-time">${formatFullDate(p.timestamp)}</div>
          <div class="prompt-text">${escapeHtml(p.display)}</div>
        </div>`;
      }
      html += '</div></div>';
    }
    body.innerHTML = html;
  }
  body.scrollTop = 0;
}

function renderMessages(messages) {
  return messages.map(m => {
    const cls = m.role === 'user' ? 'human' : m.role === 'system' ? 'system-msg' : 'bot';
    return `<div class="message ${cls}">
      <div class="message-content">${renderMarkdown(m.content || '')}</div>
    </div>`;
  }).join('');
}

const markedInstance = new marked.Marked({
  breaks: false,
  gfm: true,
  renderer: {
    link({href, text}) {
      return `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
    }
  }
});

function renderMarkdown(text) {
  return markedInstance.parse(text.replace(/~/g, '\\~'));
}

function goBack() {
  document.getElementById('sidebar').classList.remove('hidden');
  if (window.innerWidth <= 700) document.getElementById('main').classList.add('hidden');
}

async function init() {
  try {
    allSessions = await fetchJSON('/api/sessions');
    renderFilters(allSessions);
    renderSessionList(allSessions);
    const stats = await fetchJSON('/api/stats');
    const footer = document.getElementById('sidebarFooter');
    const srcCount = Object.keys(stats.sources || {}).length;
    footer.innerHTML = `<span>${stats.total} conversations</span><span>${srcCount} source${srcCount !== 1 ? 's' : ''}</span>`;
  } catch (e) {
    document.getElementById('sessionList').innerHTML = `
      <div style="padding:20px;text-align:center;color:var(--faint);font-size:12px">
        Could not connect.<br>
        <code style="font-family:var(--mono);font-size:11px;display:block;margin-top:6px">python3 server.py</code>
      </div>`;
  }
}

document.getElementById('searchInput').addEventListener('input', () => renderSessionList(allSessions));
init();
</script>
</body>
</html>
